name: flexpay_mob
description: SPD E-Banking
publish_to: 'none'
version: 3.0.0+5

environment:
  sdk: '>=3.0.6 <4.0.0'

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/S.jpg
    - assets/images/langs/mk.png
    - assets/images/langs/en.png
    - assets/images/currencies/


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI & Utilities ---
  cupertino_icons: ^1.0.5
  intl: ^0.20.2
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0
  sprintf: ^7.0.0
  pie_chart: ^5.0.0
  sticky_headers: ^0.3.0+2

  # --- State & Data ---
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  http: ^1.6.0
  html: ^0.15.0
  xml: ^6.5.0

  # --- Systems & Auth ---
  package_info_plus: ^10.2.0
  url_launcher: ^6.1.10
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0

  # --- Web & Specialized ---
  flutter_inappwebview: ^6.1.5
  webview_flutter: ^4.2.1
  syncfusion_flutter_calendar: ^34.1.29
  syncfusion_localizations: ^34.1.29

  # --- UPDATED SECURITY PLUGIN ---
  secure_display: ^0.1.0
  flutter_native_splash: ^2.4.7

  local_auth_android: any
  change_app_package_name: ^1.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_gen: ^5.12.0
  flutter_launcher_icons: ^0.14.4

# --- ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/s1.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/s1.jpg"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

# --- SPLASH SCREEN CONFIGURATION ---
flutter_native_splash:
  color: "#ffffff"
  # This image will be used for iOS and Android < 12
  image: "assets/images/s1.jpg"

  color_dark: "#121212"
  image_dark: "assets/images/s1.jpg"

  android: true
  ios: true
  fullscreen: true

  android_12:
    # This image will be used for Android 12 and greater
    image: "assets/images/s1.jpg"
    color: "#ffffff"
    icon_background_color: "#ffffff"

    image_dark: "assets/images/s1.jpg"
    color_dark: "#121212"
    icon_background_color_dark: "#121212"